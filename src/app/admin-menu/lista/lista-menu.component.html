<section class="lista-container">
	<div class="lista-header">
		<h2 class="lista-title">Itens do menu</h2>
		<button
			type="button"
			pButton
			label="Novo item"
			icon="pi pi-plus"
			(click)="openCreate()"
		></button>
	</div>

	@if (items().length === 0) {
		<div class="empty">Nenhum item cadastrado.</div>
	} @else {
		<p-table [value]="sortedItems()" responsiveLayout="scroll" [tableStyle]="{ 'min-width': '56rem' }">
			<ng-template pTemplate="header">
				<tr>
					<th>Categoria</th>
					<th>Nome</th>
					<th>Ingredientes</th>
					<th>Valor</th>
					<th>Imagem</th>
					<th class="col-actions">Acoes</th>
				</tr>
			</ng-template>
			<ng-template pTemplate="body" let-item>
				<tr>
					<td>{{ formatCategoria(item.categoria) }}</td>
					<td class="col-name">{{ item.nome }}</td>
					<td class="col-ingred">{{ item.ingredientes }}</td>
					<td class="col-valor">R$ {{ item.valor | number:'1.2-2' }}</td>
					<td>
						@if (item.imagemDataUrl) {
							<img class="thumb" [src]="item.imagemDataUrl" [alt]="'Foto de ' + item.nome" />
						} @else {
							<span class="muted">Sem imagem</span>
						}
					</td>
					<td class="col-actions">
						<button
							type="button"
							pButton
							icon="pi pi-pencil"
							[text]="true"
							aria-label="Editar {{ item.nome }}"
							(click)="openEdit(item)"
						></button>
						<button
							type="button"
							pButton
							icon="pi pi-trash"
							[text]="true"
							severity="danger"
							aria-label="Excluir {{ item.nome }}"
							(click)="confirmDelete(item)"
						></button>
					</td>
				</tr>
			</ng-template>
		</p-table>

		<p-paginator
			[first]="currentPage() * pageSize"
			[rows]="pageSize"
			[totalRecords]="totalRecords()"
			(onPageChange)="onPageChange($event)"
		></p-paginator>
	}

	<p-dialog
		[header]="dialogTitle()"
		[visible]="dialogVisible()"
		[modal]="true"
		[draggable]="false"
		[resizable]="false"
		[style]="{ width: 'min(720px, 96vw)' }"
		(onHide)="closeDialog()"
	>
		<menu-form [item]="activeItem()" (formSubmit)="handleSave($event)"></menu-form>
		<ng-template pTemplate="footer">
			<button type="button" pButton label="Cancelar" [text]="true" (click)="closeDialog()"></button>
			<button type="button" pButton label="Salvar" (click)="submitForm()"></button>
		</ng-template>
	</p-dialog>

	<p-confirmDialog></p-confirmDialog>
</section>
